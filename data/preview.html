<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>preview</title>
<style>html,body{margin:0;padding:0;background:#0a0c09;overflow:hidden}iframe{display:block;width:100vw;height:100vh;border:0}</style>
</head>
<body>
<iframe id="frame" src="../index.html"></iframe>
<script>
const state = new URLSearchParams(location.search).get('state') || 'map';
const locId = new URLSearchParams(location.search).get('loc') || 'aotai';
const frame = document.getElementById('frame');
const fw = new URLSearchParams(location.search).get('w');
if (fw) {
  frame.style.width = fw + 'px';
  frame.style.height = (new URLSearchParams(location.search).get('h') || '860') + 'px';
  document.body.style.display = 'flex';
  document.body.style.justifyContent = 'center';
  document.body.style.alignItems = 'flex-start';
}
const wait = ms => new Promise(r => setTimeout(r, ms));
function apply(w, App) {
  const st = w.document.createElement('style');
  st.textContent = '*{animation:none!important;transition:none!important}';
  const hide = new URLSearchParams(location.search).get('hide');
  if (hide) st.textContent += hide.split(',').map(x => x + '{display:none!important}').join('');
  w.document.head.appendChild(st);
  App.locId = locId; App.cart = {};
  if (state === 'login') { App.show('login'); }
  else if (state === 'title') { App.show('title'); }
  else if (state === 'map') {
    App.show('map');
    w.eval('MapView.pick("' + locId + '")');
  } else if (state === 'routes') { App.show('routes'); App.renderRoutes(); }
  else if (state === 'gear') { App.show('gear'); App.renderGearCodex(); }
  else if (state === 'lore') { App.show('lore'); App.renderLore(); }
  else if (state === 'notice') { App.show('notice'); }
  else if (state === 'about') { App.show('about'); }
  else if (state === 'archive') { App.show('archive'); }
  else if (state === 'brief') { App.openBrief(locId); }
  else if (state === 'market') {
    App.openBrief(locId); App.openMarket();
    ['shell','down','bag','tent'].forEach(id => { App.cart[id] = 1; });
    App.cart.water = 8; App.cart.food = 8;
    App.renderMarket();
  } else if (state === 'run' || state === 'event' || state === 'result') {
    ['shell','down','bag','tent'].forEach(id => { App.cart[id] = 1; });
    App.cart.water = 8; App.cart.food = 8;
    w.eval('Engine').start(locId, App.cart);
    App.enterRun();
    if (state === 'event') App.openEvent(w.EVENTS[locId][0]);
    if (state === 'result') { w.eval('Engine').finish(true, '抵达'); App.showResult(); }
  }
  document.title = 'preview-' + state;
  const probe = new URLSearchParams(location.search).get('probe');
  if (probe) {
    const sels = ['body', '#site-foot', '.notice-wrap', '.login-inner', '.login-form', '.avatar-grid', '.avatar-btn', '.title-pick', '.login-title', '.title-bg', '.title-sky', '.title-beam', '.title-moon', '.title-inner', '.mega-title', '.map-frame', '#map-svg-wrap', '.map-filters'];
    const rows = ['bodyClass=' + w.document.body.className].concat(sels.map(sel => {
      const el = w.document.querySelector(sel);
      if (!el) return sel + ': MISSING';
      const r = el.getBoundingClientRect();
      const cs = w.getComputedStyle(el);
      return sel + ': ' + Math.round(r.left) + ',' + Math.round(r.top) + ' ' + Math.round(r.width) + 'x' + Math.round(r.height) +
        ' disp=' + cs.display + ' hidden=' + el.hidden + ' op=' + cs.opacity;
    }));
    const pre = document.createElement('pre');
    pre.id = 'layout-probe';
    pre.textContent = rows.join('\n');
    document.body.appendChild(pre);
  }
}

function getApp(w) {
  try {
    const a = w.eval('typeof App !== "undefined" ? App : null');
    if (a && a.bootProfile) return a;
  } catch (e) {}
  return null;
}

window.addEventListener('load', () => {
  const w = frame.contentWindow;
  const App = getApp(w);
  if (App) apply(w, App);
});

(async () => {
  let w = frame.contentWindow;
  for (let i = 0; i < 40; i++) {
    const App = getApp(w);
    if (App) { apply(w, App); return; }
    await wait(80); w = frame.contentWindow;
  }
})();
</script>
</body></html>
